<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page_title }} | StudyForge</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}" />
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='/favicon.svg') }}" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/">StudyForge</a>
        <nav class="nav">
          <a href="/">Главная</a>
          <a href="/dashboard">Панель</a>
          {% if current_user %}
          <a href="/notes">Заметки</a>
          <a href="/logout">Выход</a>
          {% else %}
          <a href="/login">Вход</a>
          <a href="/register">Регистрация</a>
          {% endif %}
        </nav>
      </header>
      {% if page_message %}
      <div class="page-banner">{{ page_message }}</div>
      {% endif %}
      <main class="page">
        {% block content %}{% endblock %}
      </main>
    </div>
    <script src="{{ url_for('static', path='/js/app.js') }}" defer></script>
  </body>
</html>
